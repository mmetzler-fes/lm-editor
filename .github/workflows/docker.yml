name: Docker-Image

# ghcr.io/mmetzler-fes/lm-editor für docker-compose.yaml – für ARM (Mac mit
# Apple-Chip, Raspberry Pi) und Intel/AMD (Windows-PCs). Das Image enthält nur
# Dateien und Node, darum stört die Emulation (QEMU) beim Bauen kaum.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'icons/**'
      - 'examples/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'tools/serve.mjs'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/mmetzler-fes/lm-editor:latest
