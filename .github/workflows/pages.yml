name: Webapp (GitHub Pages)

# Der Editor als installierbare Web-App unter https://mmetzler-fes.github.io/lm-editor/
# – rein statisch, ohne Build-Schritt. In den Einstellungen des Repositorys
# muss Pages auf „GitHub Actions“ stehen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Nur, was die App braucht – ohne Tests, Werkzeuge und Pläne.
      - run: mkdir site && cp -r index.html manifest.webmanifest sw.js icons src examples LICENSE site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
