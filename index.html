<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lm-editor</title>
  <link rel="stylesheet" href="src/css/modules.css" />
  <link rel="stylesheet" href="src/css/ink.css" />
  <link rel="stylesheet" href="src/css/paper.css" />
  <link rel="stylesheet" href="src/app/app.css" />
</head>
<body>
  <main id="start" class="app-start">
    <header>
      <h1>✍️ lm-editor</h1>
      <p>Arbeitsblätter mit Stift, Finger oder Maus bearbeiten – mit Karos, Formeln und Quizzen im Blatt.</p>
    </header>
    <div class="app-actions">
      <button type="button" class="btn btn-primary" id="btnOpen">📂 .zlm öffnen</button>
      <button type="button" class="btn btn-secondary" id="btnExample">✨ Beispiel: Ohmsches Gesetz</button>
      <button type="button" class="btn btn-secondary" id="btnKaro">▦ Neues Karoblatt</button>
    </div>
    <section>
      <h2>Zuletzt geöffnet</h2>
      <ul id="recent" class="app-recent"></ul>
      <p class="app-hint">Entwürfe bleiben in diesem Browser. Mit „💾 Speichern“ im Editor wird daraus eine .zlm-Datei.
        Eine .zlm lässt sich auch einfach auf diese Seite ziehen.</p>
    </section>
  </main>
  <script type="module" src="src/app/app.js"></script>
</body>
</html>
